<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login ? CPE Migrator ? DSTech Telecom</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css" />
  <style>
    body { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .login-card {
      width: 100%; max-width: 420px;
      background: rgba(13, 18, 30, 0.88);
      border: 1px solid rgba(34, 211, 238, 0.22);
      border-radius: 16px; padding: 32px 28px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 0 30px rgba(34, 211, 238, 0.08);
      backdrop-filter: blur(12px);
    }
    .login-header { display: flex; align-items: center; gap: 14px; margin-bottom: 26px; }
    .login-title h1 { font-size: 1.25rem; font-weight: 700; color: #f8fafc; margin: 0; }
    .login-title p { font-size: 0.8rem; color: #94a3b8; margin: 3px 0 0; }
    .login-field { margin-bottom: 18px; }
    .login-field label {
      display: block; font-size: 0.78rem; font-weight: 600; color: #94a3b8;
      margin-bottom: 7px; text-transform: uppercase; letter-spacing: 0.05em;
    }
    .login-field input {
      width: 100%; padding: 12px 14px; border-radius: 10px;
      border: 1px solid rgba(148, 163, 184, 0.2);
      background: rgba(15, 23, 42, 0.85); color: #f8fafc;
      font-family: "JetBrains Mono", monospace; font-size: 0.92rem; outline: none;
    }
    .login-field input:focus { border-color: #22d3ee; box-shadow: 0 0 0 3px rgba(34, 211, 238, 0.15); }
    .login-error {
      display: none; background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.35); color: #fca5a5;
      padding: 10px 12px; border-radius: 8px; font-size: 0.82rem; margin-bottom: 16px;
    }
    .login-btn {
      width: 100%; padding: 13px; border: none; border-radius: 10px;
      background: linear-gradient(135deg, #22d3ee, #06b6d4);
      color: #04131a; font-weight: 700; font-size: 0.95rem; cursor: pointer;
    }
    .login-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  </style>
</head>
<body>
  <div class="bg-grid"></div>
  <div class="login-card">
    <div class="login-header">
      <div class="brand-mark">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <path d="M2 12h4l3-9 4 18 3-9h6"/>
        </svg>
      </div>
      <div class="login-title">
        <h1>CPE Migrator</h1>
        <p>DSTech Telecom ? Acesso Restrito</p>
      </div>
    </div>
    <div id="loginError" class="login-error"></div>
    <form id="loginForm">
      <div class="login-field">
        <label for="username">Usuario</label>
        <input id="username" name="username" type="text" autocomplete="username" required autofocus placeholder="admin" />
      </div>
      <div class="login-field">
        <label for="password">Senha</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required placeholder="????????" />
      </div>
      <button id="submitBtn" type="submit" class="login-btn">Entrar no Painel</button>
    </form>
  </div>
  <script>
    const form = document.getElementById("loginForm");
    const errBox = document.getElementById("loginError");
    const btn = document.getElementById("submitBtn");
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errBox.style.display = "none";
      btn.disabled = true;
      btn.textContent = "Autenticando...";
      try {
        const res = await fetch("/api/app-login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            username: document.getElementById("username").value.trim(),
            password: document.getElementById("password").value
          })
        });
        const data = await res.json().catch(() => ({}));
        if (res.ok && data.ok) window.location.href = "/";
        else {
          errBox.textContent = data.error || "Credenciais invalidas.";
          errBox.style.display = "block";
        }
      } catch (err) {
        errBox.textContent = "Falha de conexao com o servidor.";
        errBox.style.display = "block";
      } finally {
        btn.disabled = false;
        btn.textContent = "Entrar no Painel";
      }
    });
  </script>
</body>
</html>
